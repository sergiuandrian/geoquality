version: 1
name: "Admin boundaries profile"

sources:
  - path: "data/"
    pattern: "*.gpkg"

defaults:
  crs:
    required: true
    allowed_epsg: [4326, 3857]
  geometry:
    valid: true
  duplicates:
    exact: true
    severity: warn

layers:
  admin:
    attributes:
      required: [name]
      not_null: [name]
      unique: [code]
      domains:
        # Adjust to your coding scheme (ISO, national ADM codes, …).
        level:
          allowed: ["0", "1", "2", "3", country, region, district, municipality]
    topology:
      enabled: true
      severity: error
      no_overlaps: true
      no_coverage_gaps: true
      coincident_edges: true
      boundary_tolerance: 1.0
      min_area: 1.0
      # Prefer an explicit AOI for coastal / sparse admin units:
      # aoi: "data/country_aoi.gpkg"

report:
  max_issues_per_check: 100
